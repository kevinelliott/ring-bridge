services:
  ring-bridge:
    image: ghcr.io/kevinelliott/ring-bridge:latest
    # Or build locally instead:
    # build: .
    #
    # Host networking keeps RTSP simple: no port juggling for RTP, and NVRs on
    # the LAN reach the stream at the host's own address.
    network_mode: host
    restart: unless-stopped
    volumes:
      # The container works out of /config, so .env and
      # ring-bridge.config.json both live here.
      - ./config:/config
    # Uncomment for Intel Quick Sync or VA-API hardware encoding:
    # devices:
    #   - /dev/dri:/dev/dri
