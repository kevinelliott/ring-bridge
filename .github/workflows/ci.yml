name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ffmpeg is not a test dependency today, but doctor and the encoder
      # probe shell out to it, so keep the environment honest.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The published artifact is compiled JS, so a broken build is a broken
      # release. Check it here rather than at publish time.
      - name: Build
        run: npm run build

      - name: Built CLI runs on plain node
        run: node dist/cli.js --help

      # Nothing here reaches Ring, so these must work without a token.
      - name: CLI runs without credentials
        run: |
          npx tsx cli.ts --help
          npx tsx cli.ts encoders

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing is a release concern, not a per-push one.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ring-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts and prints usage
        run: docker run --rm ring-bridge:ci --help

      - name: Image has a working ffmpeg
        run: docker run --rm --entrypoint ffmpeg ring-bridge:ci -version
