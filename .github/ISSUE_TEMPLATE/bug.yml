name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ring-bridge doctor`
      description: This answers most environment questions at once.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        From the Logs tab or the terminal. `DEBUG=ring` adds the library's
        internals and full ffmpeg stderr. Redact anything identifying.
      render: shell
  - type: input
    id: cameras
    attributes:
      label: Camera models
      placeholder: "Doorbell Elite, Floodlight Cam"
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [npm, Docker, from source]
